[package]
name = "qk-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Task input hashing and caching for the qk task runner"
publish.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
fs2.workspace = true
globset.workspace = true
ignore.workspace = true
qk-config.workspace = true
qk-graph.workspace = true
qk-taskgraph.workspace = true
qk-executor.workspace = true
qk-lockfile.workspace = true
jsonc-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
rusty-s3.workspace = true
ureq.workspace = true
url.workspace = true
walkdir.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
