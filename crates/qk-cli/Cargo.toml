[package]
name = "qk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast standalone task runner that reads Nx workspaces"
publish.workspace = true

[[bin]]
name = "qk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
qk-config.workspace = true
qk-graph.workspace = true
qk-taskgraph.workspace = true
qk-runner.workspace = true
qk-executor.workspace = true
qk-cache.workspace = true
qk-affected.workspace = true
qk-history.workspace = true
qk-lockfile.workspace = true
terminal_size.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.npm]
name = "runqk"
prefix = "@runqk/cli-"
bins = ["qk"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
custom = { publishConfig = { access = "public" } }
