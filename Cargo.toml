[workspace]
members = ["crates/qk-cli", "crates/qk-config", "crates/qk-graph"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
qk-config = { path = "crates/qk-config" }
qk-graph = { path = "crates/qk-graph" }

[profile.release]
lto = "thin"
strip = true

