[workspace]
members = ["crates/qk-cli", "crates/qk-config", "crates/qk-graph", "crates/qk-taskgraph", "crates/qk-executor", "crates/qk-runner", "crates/qk-cache", "crates/qk-lockfile", "crates/qk-affected", "crates/qk-history", "crates/qk-input-analysis"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = ["crates-io"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pajn/qk"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
publish = false
allow-branch = ["main"]

[workspace.dependencies]
fallout = "0.4"
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
foldhash = "0.2"
rustix = { version = "1.1", features = ["fs"] }
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
command-group = "5"
ctrlc = { version = "3", features = ["termination"] }
notify = "8.2"
dotenvy = "0.15"
libc = "0.2"
shlex = "2"
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.32", features = ["preserve_order", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
rusty-s3 = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
ureq = "3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
terminal_size = "0.4"
url = "2"
zstd = { version = "0.13", default-features = false }
qk-config = { path = "crates/qk-config", version = "=0.3.1" }
qk-graph = { path = "crates/qk-graph", version = "=0.3.1" }
qk-taskgraph = { path = "crates/qk-taskgraph", version = "=0.3.1" }
qk-executor = { path = "crates/qk-executor", version = "=0.3.1" }
qk-runner = { path = "crates/qk-runner", version = "=0.3.1" }
qk-cache = { path = "crates/qk-cache", version = "=0.3.1" }
qk-lockfile = { path = "crates/qk-lockfile", version = "=0.3.1" }
qk-affected = { path = "crates/qk-affected", version = "=0.3.1" }
qk-history = { path = "crates/qk-history", version = "=0.3.1" }
qk-input-analysis = { path = "crates/qk-input-analysis", version = "=0.3.1" }

[profile.release]
lto = "thin"
strip = true
