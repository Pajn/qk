[workspace]
members = ["crates/qk-cli", "crates/qk-config", "crates/qk-graph", "crates/qk-taskgraph", "crates/qk-executor", "crates/qk-runner", "crates/qk-cache", "crates/qk-lockfile", "crates/qk-affected"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
command-group = "5"
ctrlc = { version = "3", features = ["termination"] }
dotenvy = "0.15"
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
rusty-s3 = "0.10"
ureq = "3"
url = "2"
qk-config = { path = "crates/qk-config" }
qk-graph = { path = "crates/qk-graph" }
qk-taskgraph = { path = "crates/qk-taskgraph" }
qk-executor = { path = "crates/qk-executor" }
qk-runner = { path = "crates/qk-runner" }
qk-cache = { path = "crates/qk-cache" }
qk-lockfile = { path = "crates/qk-lockfile" }
qk-affected = { path = "crates/qk-affected" }

[profile.release]
lto = "thin"
strip = true
