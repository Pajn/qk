name: Release

# Pushing a tag v<version> matching the workspace version builds qk for each
# supported platform and attaches the binaries to a GitHub release.
# npm packages publish through OIDC once NPM_PUBLISH is true and each
# package trusts this repository and release.yml on npm.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - run: cargo build --release --locked -p qk-cli --target ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo install cargo-npm --version 0.1.4 --locked
      - run: cargo npm generate -p qk-cli --target ${{ matrix.target }}
      - name: Test installed npm packages and binary archive
        shell: bash
        run: |
          binary=qk
          if [ "${{ runner.os }}" = Windows ]; then binary=qk.exe; fi
          node tools/npm/smoke.mjs --packages npm --binary "target/${{ matrix.target }}/release/$binary"
      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.target }}
          binary=qk
          if [ "${{ runner.os }}" = Windows ]; then binary=qk.exe; fi
          cp target/${{ matrix.target }}/release/$binary dist/${{ matrix.target }}/
      - uses: actions/upload-artifact@v7
        with:
          name: qk-${{ matrix.target }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Archive each platform's binary
        run: |
          cd dist
          for target in *; do
            tar -czf "../qk-$GITHUB_REF_NAME-$target.tar.gz" -C "$target" .
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes qk-*.tar.gz

  npm:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-npm
        run: cargo install cargo-npm --version 0.1.4 --locked
      - name: Arrange binaries for cargo-npm
        run: |
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            mkdir -p "target/$triple/release"
            cp "dist/$triple/"* "target/$triple/release/"
          done
      - name: Generate npm packages
        run: |
          cargo npm generate -p qk-cli
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("npm/@runqk/cli/package.json", "utf8"));
            if (pkg.repository?.url !== "git+https://github.com/Pajn/qk.git") {
              throw new Error("Repository metadata must match the npm trusted publisher");
            }
            const expected = ["@runqk/cli-linux-x64", "@runqk/cli-linux-arm64", "@runqk/cli-darwin-arm64", "@runqk/cli-win32-x64"];
            if (pkg.name !== "@runqk/cli" || expected.some(name => pkg.optionalDependencies?.[name] !== pkg.version) || Object.keys(pkg.optionalDependencies ?? {}).length !== expected.length) {
              throw new Error("Missing or unexpected platform packages");
            }
          '
      - name: Publish platform packages and @runqk/cli through OIDC
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: cargo npm publish -p qk-cli -- --access public

  crates:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify crates before requesting the short-lived token
        run: cargo publish --workspace --locked --dry-run
      - name: Authenticate with crates.io through OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the workspace in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --workspace --locked
