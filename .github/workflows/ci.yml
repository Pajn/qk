name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every failing test binary, not only the first.
      - run: cargo test --workspace --locked --no-fail-fast

  # qk against the committed Nx goldens of the parity fixture. Run cases
  # execute package scripts, so pnpm is needed; Nx is not.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - run: cargo build --release --locked -p qk-cli
      - run: node tools/parity/parity.mjs compare --qk target/release/qk

  # The goldens still describe the pinned Nx release and the current fixture.
  parity-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
        working-directory: tools/parity/nx
      - run: node tools/parity/parity.mjs capture --check

  # qk's hot paths on a generated workspace, recorded per commit in the job
  # summary and as an artifact.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y hyperfine
      - run: cargo build --release --locked -p qk-cli
      - run: node tools/bench/bench.mjs --qk target/release/qk --json bench.json --markdown bench.md
      - run: node tools/bench/output-globs.mjs --qk target/release/qk --json output-globs.json
      - run: cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: |
            bench.json
            output-globs.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify the crates.io distribution
        run: cargo publish --workspace --locked --dry-run

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - run: cargo build --release --locked -p qk-cli --target ${{ matrix.target }}
      - run: cargo install cargo-npm --version 0.1.4 --locked
      - run: cargo npm generate -p qk-cli --target ${{ matrix.target }}
      - name: Test installed npm packages and binary archive
        shell: bash
        run: |
          binary=qk
          if [ "${{ runner.os }}" = Windows ]; then binary=qk.exe; fi
          node tools/npm/smoke.mjs --packages npm --binary "target/${{ matrix.target }}/release/$binary"
