name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # tree-sitter-scss, which fallout parses stylesheets with, hands its C
  # compiler a GCC-style warning flag unconditionally, and cl.exe rejects it.
  # clang-cl reads that flag and the MSVC ones alike.
  CC_x86_64_pc_windows_msvc: clang-cl

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      - name: Install input recorder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      # Linux enforce runs tasks over overlays in user namespaces, which
      # Ubuntu's AppArmor keeps from unprivileged processes by default.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every failing test binary, not only the first. On Linux, the overlay
      # tests fail rather than skip where overlays cannot be had.
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          QK_TEST_REQUIRE_OVERLAY: ${{ runner.os == 'Linux' && '1' || '' }}

  # The tests that record what tasks do, for Ultracache, input analysis and the
  # sandbox's audit, with each recorder. `check` records
  # with whichever loads; these name one, so that neither goes untested.
  # GitHub's Linux runners give the eBPF recorder's helper root through
  # passwordless sudo, and arm64 runs the program built for it.
  recorders:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        recorder: [ebpf, strace]
    runs-on: ${{ matrix.os }}
    env:
      QK_RECORDER: ${{ matrix.recorder }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      # The tests skip without strace, which also tells them recording is
      # possible; QK_RECORDER keeps the eBPF job from falling back to it.
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked -p qk-cli --test ultracache --no-fail-fast
      - run: cargo test --locked -p qk-cli --test execution --no-fail-fast -- input sandbox warm_suggest
        env:
          QK_TEST_REQUIRE_OVERLAY: "1"
      - run: cargo test --locked -p qk-trace -p qk-executor -p qk-runner --no-fail-fast

  # The committed kernel program objects are what their source builds to.
  recorder-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/trace/build.sh
      - run: git diff --exit-code crates/qk-trace/bpf

  # qk against the committed Nx goldens of the parity fixture. Run cases
  # execute package scripts, so pnpm is needed; Nx is not.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - run: cargo build --release --locked -p qk-cli
      - run: node tools/parity/parity.mjs compare --qk target/release/qk

  # The goldens still describe the pinned Nx release and the current fixture.
  parity-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
        working-directory: tools/parity/nx
      - run: node tools/parity/parity.mjs capture --check

  # The reference store server's own tests, then qk against it, so the client
  # and the server are checked against each other.
  store-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - run: pnpm install --frozen-lockfile
        working-directory: tools/store-server
      - run: pnpm typecheck
        working-directory: tools/store-server
      - run: pnpm test
        working-directory: tools/store-server
      - run: cargo build --locked -p qk-cli
      - run: node e2e.mjs --qk ../../target/debug/qk
        working-directory: tools/store-server

  # qk's hot paths on a generated workspace, recorded per commit in the job
  # summary and as an artifact.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y hyperfine
      - run: cargo build --release --locked -p qk-cli
      - run: node tools/bench/bench.mjs --qk target/release/qk --json bench.json --markdown bench.md
      - run: node tools/bench/output-globs.mjs --qk target/release/qk --json output-globs.json
      # Fails when storing large blobs apart makes a cold restore slower than
      # keeping every blob inline.
      - run: node tools/bench/remote.mjs --qk target/release/qk --gate --json remote.json --markdown remote.md
      - run: cat bench.md remote.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: |
            bench.json
            output-globs.json
            remote.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup show
      - name: Verify the crates.io distribution
        run: cargo publish --workspace --locked --dry-run

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Rust
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p qk-cli --target ${{ matrix.target }}
      - run: cargo install cargo-npm --version 0.1.4 --locked
      - run: cargo npm generate -p qk-cli --target ${{ matrix.target }}
      - run: node tools/npm/docs.mjs --packages npm
      - name: Test installed npm packages and binary archive
        shell: bash
        run: |
          binary=qk
          if [ "${{ runner.os }}" = Windows ]; then binary=qk.exe; fi
          node tools/npm/smoke.mjs --packages npm --binary "target/${{ matrix.target }}/release/$binary"
